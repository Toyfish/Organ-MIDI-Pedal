        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_60541&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:444824,\&quot;name\&quot;:\&quot;system\&quot;,\&quot;username\&quot;:\&quot;system\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.arduino.cc/system/{size}/1140315_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2011-05-09T17:13:21.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003ehello I am very pleased to participate in this community!\\u003cbr\\u003e\\nI recently developed an autonomous airship project. For this project I wish to receive information from 30 sensors and send commands to actuators 18.\\u003cbr\\u003e\\nI have a Arduino mini pro 328 three multi / demultiplexers 74HC4067 buy from Sparkfun\\u003cbr\\u003e\\nI learn about their installation and programming but I do not see:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003ehow the physical cable to the card (ie if the 2 multiplexer and demultiplexer are on the same digital inputs?)\\u003c/li\\u003e\\n\\u003cli\\u003ehow to manage these two groups in programming\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003ethank you to you!\\u003cbr\\u003e\\nto help me in this project\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:23,\&quot;updated_at\&quot;:\&quot;2011-05-09T17:13:21.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:3106,\&quot;reads\&quot;:43,\&quot;readers_count\&quot;:42,\&quot;score\&quot;:15528.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:60541,\&quot;topic_slug\&quot;:\&quot;programing-and-wiring-2-multiplexer-demultiplexer-with-arduino\&quot;,\&quot;display_username\&quot;:\&quot;system\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:true,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:-1,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/programing-and-wiring-2-multiplexer-demultiplexer-with-arduino/60541/1\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:444825,\&quot;name\&quot;:\&quot;Grumpy_Mike\&quot;,\&quot;username\&quot;:\&quot;Grumpy_Mike\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.arduino.cc/grumpy_mike/{size}/213521_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2011-05-09T17:39:01.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eYou cannot use a 74HC4067 to multiplex outputs. Well you can but only one output can be active at any one time and all the rest of the outputs will be high impedance. You are not the first to be caught out about this but there is a lot of wrong information about.\\u003cbr\\u003e\\nTo get multiple outputs you need to use either a shift register, port expander (like the 23S17), or something with a latch.\\u003cbr\\u003e\\nFor examples of these see my projects:-\\u003cbr\\u003e\\n\\u003ca href=\\\&quot;http://www.thebox.myzen.co.uk/Hardware/CNC_Conversion.html\\\&quot;\\u003ehttp://www.thebox.myzen.co.uk/Hardware/CNC_Conversion.html\\u003c/a\\u003e - uses port expander\\u003cbr\\u003e\\n\\u003ca href=\\\&quot;http://www.thebox.myzen.co.uk/Hardware/Transistor_Tester.html\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eTransistor Tester\\u003c/a\\u003e - uses latched multoplexer\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:23,\&quot;updated_at\&quot;:\&quot;2011-05-09T17:39:01.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:31,\&quot;reads\&quot;:41,\&quot;readers_count\&quot;:40,\&quot;score\&quot;:163.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:60541,\&quot;topic_slug\&quot;:\&quot;programing-and-wiring-2-multiplexer-demultiplexer-with-arduino\&quot;,\&quot;display_username\&quot;:\&quot;Grumpy_Mike\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;http://www.thebox.myzen.co.uk/Hardware/CNC_Conversion.html\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Proxxon MF70 Miller CNC CONVERSION\&quot;,\&quot;clicks\&quot;:70},{\&quot;url\&quot;:\&quot;http://www.thebox.myzen.co.uk/Hardware/Transistor_Tester.html\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Transistor Tester\&quot;,\&quot;clicks\&quot;:17}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Karma: 3000+\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:308,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/programing-and-wiring-2-multiplexer-demultiplexer-with-arduino/60541/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:444826,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;CrossRoads\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.arduino.cc/crossroads/{size}/214033_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2011-05-09T17:59:51.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eTo control these, you connect 4 arduino outputs to the S0-S1-S2-S3 pins, that will select which I/O path thru the device will be connected.\\u003cbr\\u003e\\nThen you will have 4 more arduino outputs that will function as chip selects. You will write out S0-S3, then enable one device at a time.\\u003c/p\\u003e\\n\\u003cp\\u003eConnect the common I/O pin (pin 1) for the 2 sensor selector parts together and connect to your digital input pin.\\u003cbr\\u003e\\nThe combination of S0-S3 and the 2 enable pins will select which of the 32 outputs will appear at your digital input pin.\\u003c/p\\u003e\\n\\u003cp\\u003eConnect the common I/O pin for the 2 actuator selector parts together and connector to your digital output pin.\\u003cbr\\u003e\\nThe combination of S0-S3 and the 2 enable pins will select which of the 32 outputs will follow the actions of the digital output pin.\\u003cbr\\u003e\\nBe aware that when no outputs are selected, the pins will not be Hi or Lo, you will need a pullup or pulldown resistor to put the actuator in its Off state.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you want to use just 1 arduino pin to both read the sensors and drive the actuators, that is possible also.\\u003cbr\\u003e\\nConnect the common I/O pin from all devices to the arduino.\\u003cbr\\u003e\\nYour code will have to change the mode of the pin as you use it:\\u003cbr\\u003e\\nfor reading, pinMode(ioPin, INPUT);\\u003cbr\\u003e\\nset S0-S3, enable one of the sensor input parts\\u003cbr\\u003e\\nthen read the signal\\u003c/p\\u003e\\n\\u003cp\\u003efor writing, pinMode(ioPin, OUTPUT);\\u003cbr\\u003e\\nset S0-S3, enable one of actuator output parts\\u003cbr\\u003e\\nthen write your actuator signal hi/lo, or lo/hi, as needed.\\u003c/p\\u003e\\n\\u003cp\\u003eDoes that make sense?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:23,\&quot;updated_at\&quot;:\&quot;2011-05-09T17:59:51.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:24,\&quot;reads\&quot;:41,\&quot;readers_count\&quot;:40,\&quot;score\&quot;:128.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:60541,\&quot;topic_slug\&quot;:\&quot;programing-and-wiring-2-multiplexer-demultiplexer-with-arduino\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1926,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true, ersection.\\u003c/p\\u003e\\n\\u003cp\\u003eYou also need supply decoupling as well.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:15,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:23,\&quot;updated_at\&quot;:\&quot;2011-05-19T06:28:53.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:13,\&quot;readers_count\&quot;:12,\&quot;score\&quot;:37.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:60541,\&quot;topic_slug\&quot;:\&quot;programing-and-wiring-2-multiplexer-demultiplexer-with-arduino\&quot;,\&quot;display_username\&quot;:\&quot;Grumpy_Mike\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Karma: 3000+\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:308,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/programing-and-wiring-2-multiplexer-demultiplexer-with-arduino/60541/15\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:444839,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;CrossRoads\&quot;,\&quot;avatar_template\&quot;:\&q pted_answer\&quot;:null},{\&quot;id\&quot;:444840,\&quot;name\&quot;:\&quot;system\&quot;,\&quot;username\&quot;:\&quot;system\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.arduino.cc/system/{size}/1140315_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2011-05-22T13:47:38.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHi, I kind of have the same question, so I thought I might as well use this thread to post it in.\\u003c/p\\u003e\\n\\u003cp\\u003eIm trying to use \\u003ca href=\\\&quot;http://uk.rs-online.com/web/search/searchBrowseAction.html?method=searchProducts\\u0026amp;searchTerm=74hc151n\\u0026amp;x=0\\u0026amp;y=0\\\&quot;\\u003ehttp://uk.rs-online.com/web/search/searchBrowseAction.html?method=searchProducts\\u0026amp;searchTerm=74hc151n\\u0026amp;x=0\\u0026amp;y=0\\u003c/a\\u003e this multiplexer to read a matrix of pressure pad placed on the floor. With pressure pads i mean aluminium foil wrapped cardboard \\u0026gt; \\u003ca href=\\\&quot;http://supersoda.com/detail.php?id=00000000036\\\&quot;\\u003ehttp://supersoda.com/detail.php?id=00000000036\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eI tried to wire the 4051 multiplex/demultiplex example from tom igoe. But according to some comments I also need a pull down resistor and an capacitor to deal with multiple presses at once. Could anyone tell me what kind of resistor/capacitors I need and how to solder them correctly to the arduino ?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:17,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:23,\&quot;updated_at\&quot;:\&quot;2011-05-22T13:47:38.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:5,\&quot;reads\&quot;:12,\&quot;readers_count\&quot;:11,\&quot;score\&quot;:27.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:60541,\&quot;topic_slug\&quot;:\&quot;programing-and-wiring-2-multiplexer-demultiplexer-with-arduino\&quot;,\&quot;display_username\&quot;:\&quot;system\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;http://supersoda.com/detail.php?id=00000000036\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:2},{\&quot;url\&quot;:\&quot;http://uk.rs-online.com/web/search/searchBrowseAction.html?method=searchProducts\\u0026searchTerm=74hc151n\\u0026x=0\\u0026y=0\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:1}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:true,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:-1,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/programing-and-wiring-2-multiplexer-demultiplexer-with-arduino/60541/17\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:444841,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;CrossRoads\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.arduino.cc/crossroads/{size}/214033_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2011-05-22T20:17:00.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eYou say matrix, but what you really mean is a collection of seperate pads and you want to sense when any are activated.\\u003cbr\\u003e\\nThe pads themselves are passive devices, yes? Really just a switch.\\u003cbr\\u003e\\nSo wire each switch with one side to a 4051 input and a pullup resistor to +5v, and the other side to ground.\\u003cbr\\u003e\\nThen just scan thru the addresses reading the inputs one by in a loop, when you see a 0 you act on the switch(es) that is(are) closed.\\u003cbr\\u003e\\nNo pulldown resistors, no capacitors.\\u003cbr\\u003e\\nYour loop can be a blink without delay kind of thing. Every XXmS you read all 16 inputs and set fllag if one is closed. Then you have a section of code that turns on lights or makes a sound or whatever when you see a flag is set, and ignores any new setting of the same flag until your lights/sound whatever is done.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:23,\&quot;updated_at\&quot;:\&quot;2011-05-22T20:17:00.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:4,\&quot;reads\&quot;:11,\&quot;readers_count\&quot;:10,\&quot;score\&quot;:22.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:60541,\&quot;topic_slug\&quot;:\&quot;programing-and-wiring-2-multiplexer-demultiplexer-with-arduino\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;             <div class='post' itemprop='text'>
              <p>hello I am very pleased to participate in this community!<br>
I recently developed an autonomous airship project. For this project I wish to receive information from 30 sensors and send commands to actuators 18.<br>
I have a Arduino mini pro 328 three multi / demultiplexers 74HC4067 buy from Sparkfun<br>
I learn about their installation and programming but I do not see:</p>
<ol>
<li>how the physical cable to the card (ie if the 2 multiplexer and demultiplexer are on the same digital inputs?)</li>
<li>how to manage these two groups in programming</li>
</ol>
<p>thank you to you!<br>
to help me in this project</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">

          <div id='post_2' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.arduino.cc/u/Grumpy_Mike'><span itemprop='name'>Grumpy_Mike</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2011-05-09T17:39:01Z' class='post-time'>
                    9. Maj 2011, 17:39
                  </time>
                  <meta itemprop='dateModified' content='2011-05-09T17:39:01Z'>
              <span itemprop='position'>2</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>You cannot use a 74HC4067 to multiplex outputs. Well you can but only one output can be active at any one time and all the rest of the outputs will be high impedance. You are not the first to be caught out about this but there is a lot of wrong information about.<br>
To get multiple outputs you need to use either a shift register, port expander (like the 23S17), or something with a latch.<br>
For examples of these see my projects:-<br>
<a href="http://www.thebox.myzen.co.uk/Hardware/CNC_Conversion.html">http://www.thebox.myzen.co.uk/Hardware/CNC_Conversion.html</a> - uses port expander<br>
<a href="http://www.thebox.myzen.co.uk/Hardware/Transistor_Tester.html" class="inline-onebox">Transistor Tester</a> - uses latched multoplexer</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>

          </div>
          <div id='post_3' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.arduino.cc/u/CrossRoads'><span itemprop='name'>CrossRoads</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2011-05-09T17:59:51Z' class='post-time'>
                    9. Maj 2011, 17:59
                  </time>
                  <meta itemprop='dateModified' content='2011-05-09T17:59:51Z'>
              <span itemprop='position'>3</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>To control these, you connect 4 arduino outputs to the S0-S1-S2-S3 pins, that will select which I/O path thru the device will be connected.<br>
Then you will have 4 more arduino outputs that will function as chip selects. You will write out S0-S3, then enable one device at a time.</p>
<p>Connect the common I/O pin (pin 1) for the 2 sensor selector parts together and connect to your digital input pin.<br>
The combination of S0-S3 and the 2 enable pins will select which of the 32 outputs will appear at your digital input pin.</p>
<p>Connect the common I/O pin for the 2 actuator selector parts together and connector to your digital output pin.<br>
The combination of S0-S3 and the 2 enable pins will select which of the 32 outputs will follow the actions of the digital output pin.<br>
Be aware that when no outputs are selected, the pins will not be Hi or Lo, you will need a pullup or pulldown resistor to put the actuator in its Off state.</p>
<p>If you want to use just 1 arduino pin to both read the sensors and drive the actuators, that is possible also.<br>
Connect the common I/O pin from all devices to the arduino.<br>
Your code will have to change the mode of the pin as you use it:<br>
for reading, pinMode(ioPin, INPUT);<br>
set S0-S3, enable one of the sensor input parts<br>
then read the signal</p>
<p>for writing, pinMode(ioPin, OUTPUT);<br>
set S0-S3, enable one of actuator output parts<br>
then write your actuator signal hi/lo, or lo/hi, as needed.</p>
<p>Does that make sense?</p>
            </div>

            <div class='post' itemprop='text'>
              <p>You say matrix, but what you really mean is a collection of seperate pads and you want to sense when any are activated.<br>
The pads themselves are passive devices, yes? Really just a switch.<br>
So wire each switch with one side to a 4051 input and a pullup resistor to +5v, and the other side to ground.<br>
Then just scan thru the addresses reading the inputs one by in a loop, when you see a 0 you act on the switch(es) that is(are) closed.<br>
No pulldown resistors, no capacitors.<br>
Your loop can be a blink without delay kind of thing. Every XXmS you read all 16 inputs and set fllag if one is closed. Then you have a section of code that turns on lights or makes a sound or whatever when you see a flag is set, and ignores any new setting of the same flag until your lights/sound whatever is done.</p>
